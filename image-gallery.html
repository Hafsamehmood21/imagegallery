<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<style>
  :root{
    --bg:#0f0f1a; --card:#1a1a2e; --accent:#7c4dff; --text:#eee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg); color:var(--text); padding:30px 20px;
  }
  h1{text-align:center; margin-bottom:10px;}
  .filters{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:25px;
  }
  .filters button{
    background:var(--card); color:var(--text); border:1px solid #333;
    padding:8px 16px; border-radius:20px; cursor:pointer; transition:.3s;
  }
  .filters button:hover, .filters button.active{
    background:var(--accent); border-color:var(--accent);
  }
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:16px; max-width:1100px; margin:0 auto;
  }
  .gallery img{
    width:100%; height:180px; object-fit:cover; border-radius:12px;
    cursor:pointer; transition:transform .3s ease, box-shadow .3s ease;
    display:block;
  }
  .gallery img:hover{
    transform:scale(1.05);
    box-shadow:0 8px 20px rgba(124,77,255,.5);
  }
  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.9);
    align-items:center; justify-content:center; z-index:100;
    animation:fade .3s ease;
  }
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .lightbox.active{display:flex;}
  .lightbox img{
    max-width:85vw; max-height:80vh; border-radius:10px;
    box-shadow:0 0 40px rgba(124,77,255,.6);
  }
  .lightbox .close{
    position:absolute; top:20px; right:30px; font-size:32px; cursor:pointer;
  }
  .lightbox .nav{
    position:absolute; top:50%; transform:translateY(-50%);
    font-size:40px; cursor:pointer; user-select:none; padding:10px;
    color:#fff; opacity:.8; transition:.2s;
  }
  .lightbox .nav:hover{opacity:1; color:var(--accent);}
  .prev{left:20px;} .next{right:20px;}
  @media(max-width:500px){
    .gallery{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  }
</style>
</head>
<body>

<h1>📷 Image Gallery</h1>

<div class="filters" id="filters"></div>
<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <span class="close" id="close">&times;</span>
  <span class="nav prev" id="prev">&#10094;</span>
  <img id="lightbox-img" src="" alt="">
  <span class="nav next" id="next">&#10095;</span>
</div>

<script>
const images = [
  {url:"https://picsum.photos/id/1015/600/400", category:"nature"},
  {url:"https://picsum.photos/id/1025/600/400", category:"animals"},
  {url:"https://picsum.photos/id/1035/600/400", category:"nature"},
  {url:"https://picsum.photos/id/1045/600/400", category:"tech"},
  {url:"https://picsum.photos/id/1055/600/400", category:"nature"},
  {url:"https://picsum.photos/id/1065/600/400", category:"animals"},
  {url:"https://picsum.photos/id/1075/600/400", category:"people"},
  {url:"https://picsum.photos/id/1084/600/400", category:"animals"},
];

const galleryEl = document.getElementById('gallery');
const filtersEl = document.getElementById('filters');
const categories = ["all", ...new Set(images.map(i=>i.category))];
let currentFilter = "all";
let currentIndex = 0;

function renderFilters(){
  filtersEl.innerHTML = categories.map(c =>
    `<button data-cat="${c}" class="${c===currentFilter?'active':''}">${c}</button>`
  ).join('');
}

function renderGallery(){
  const filtered = images.filter(i => currentFilter==="all" || i.category===currentFilter);
  galleryEl.innerHTML = filtered.map((img,i) =>
    `<img src="${img.url}" data-index="${i}" alt="Gallery image">`
  ).join('');
}

function getFiltered(){
  return images.filter(i => currentFilter==="all" || i.category===currentFilter);
}

filtersEl.addEventListener('click', e=>{
  if(e.target.tagName==='BUTTON'){
    currentFilter = e.target.dataset.cat;
    renderFilters();
    renderGallery();
  }
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

galleryEl.addEventListener('click', e=>{
  if(e.target.tagName==='IMG'){
    currentIndex = parseInt(e.target.dataset.index);
    openLightbox();
  }
});

function openLightbox(){
  const filtered = getFiltered();
  lightboxImg.src = filtered[currentIndex].url;
  lightbox.classList.add('active');
}

document.getElementById('close').onclick = ()=> lightbox.classList.remove('active');
lightbox.onclick = e=>{ if(e.target===lightbox) lightbox.classList.remove('active'); };

document.getElementById('next').onclick = ()=>{
  const filtered = getFiltered();
  currentIndex = (currentIndex+1) % filtered.length;
  lightboxImg.src = filtered[currentIndex].url;
};
document.getElementById('prev').onclick = ()=>{
  const filtered = getFiltered();
  currentIndex = (currentIndex-1+filtered.length) % filtered.length;
  lightboxImg.src = filtered[currentIndex].url;
};

document.addEventListener('keydown', e=>{
  if(!lightbox.classList.contains('active')) return;
  if(e.key==='Escape') lightbox.classList.remove('active');
  if(e.key==='ArrowRight') document.getElementById('next').click();
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
});

renderFilters();
renderGallery();
</script>
</body>
</html>
